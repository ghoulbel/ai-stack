services:
  # ──────────────────────────────────────────────
  # Ollama - LLM engine (NVIDIA)
  # ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Loopback + tailnet only, never 0.0.0.0. Ollama has no authentication of
    # any kind, so anything that can open this port can run any model on the
    # GPU. Binding it to the LAN meant every device on the Wi-Fi — guests,
    # a compromised phone, anything — could do that for free.
    #
    # Both entries are needed:
    #   127.0.0.1        opencode's embedding provider talks to it here, and so
    #                    does OpenWebUI inside the container network.
    #   TAILSCALE_IP     lets you run opencode / Ollama from another tailnet
    #                    device (laptop, phone) without exposing the API to the
    #                    LAN. This is machine-to-machine access (rule 6): it
    #                    deliberately does not go through Authentik.
    # ${TAILSCALE_IP:?} rather than ${TAILSCALE_IP:-} so that a blank value
    # fails loudly instead of silently becoming a 0.0.0.0 binding.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
      - "${TAILSCALE_IP:?TAILSCALE_IP unset - run ../bootstrap.sh}:${OLLAMA_PORT:-11434}:11434"
    gpus: all
    shm_size: 64g
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_HOST=0.0.0.0:11434
      # Was "*", which lets any web page you happen to visit drive your GPU.
      # Every real consumer (OpenWebUI, opencode) is server-side and never
      # sends an Origin, so this only restricts the browser-accessible UI.
      - OLLAMA_ORIGINS=http://localhost:11434,http://127.0.0.1:11434,http://${TAILSCALE_IP:?}:11434
      - OLLAMA_CONTEXT_LENGTH=32768
      # - OLLAMA_NUM_GPU=31
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
    networks:
      - ai-net

  # ──────────────────────────────────────────────
  # Open-WebUI - Frontend
  # ──────────────────────────────────────────────
  open-webui:
    # ":latest" on purpose, matching every other floating tag in this stack
    # (ollama, searxng, qdrant, mcpo below...). "docker compose pull" is then a
    # real upgrade path.
    #
    # The trade-off, stated once so it is not a surprise: this is a rolling
    # build tag, so an untested OpenWebUI upgrade can land on a live service
    # holding real chat history and user accounts. That is fine here because
    # accounts live in Authentik and OpenWebUI rows are re-provisioned from the
    # SSO identity, so a bad build costs you the UI, not the data.
    #
    # Do NOT substitute a "vX.Y.Z" tag casually: this project ships several
    # different builds that all self-report the same version number, so a
    # version tag can be a silent downgrade. "latest" and "main" are the same
    # image; either is fine.
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    # Human access: Traefik only, which is the single front door. This host is
    # never published on 0.0.0.0.
    #
    # Machine-to-machine: loopback only, and it is needed. opencode's LLM
    # provider is configured with baseURL http://127.0.0.1:3000/api/v1, so
    # without this entry opencode cannot reach the model at all (verified: the
    # port returned nothing once it was removed). Loopback is not "exposed" —
    # nothing on the LAN can open it — and it is exactly the shape of the
    # Authentik recovery listener. This is Type B traffic (rule 6): it
    # authenticates with an API key, never with interactive Authentik.
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.openwebui.rule: Host(`openwebui.ghoulhub.uk`)
      traefik.http.routers.openwebui.entrypoints: "websecure"
      traefik.http.routers.openwebui.tls: "true"
      traefik.http.routers.openwebui.tls.certresolver: "le"
      traefik.http.routers.openwebui.priority: "10"
      # Traefik forward-auth IS the login. OpenWebUI's own OIDC path is broken
      # against Authentik (authlib lazily GETs the issuer root, Authentik answers
      # 302 -> /.well-known/openid-configuration, and raise_for_status() throws),
      # so instead we let Traefik authenticate once and inject the identity as a
      # header. OpenWebUI's WEBUI_AUTH_TRUSTED_EMAIL_HEADER then auto-logs the
      # user in by email. One login, one MFA, and the emails match the existing
      # local accounts so no history is lost.
      traefik.http.routers.openwebui.middlewares: "rate-limit,security-headers,authentik-forwardauth"
      # Companion router so the Authentik OAuth callback can reach this host
      # WITHOUT being re-challenged by forward-auth (rule 9 deadlock). Must outrank
      # the app router, hence priority 15 vs 10.
      traefik.http.routers.openwebui-outpost.rule: Host(`openwebui.ghoulhub.uk`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.openwebui-outpost.entrypoints: "websecure"
      traefik.http.routers.openwebui-outpost.tls: "true"
      traefik.http.routers.openwebui-outpost.tls.certresolver: "le"
      traefik.http.routers.openwebui-outpost.priority: "15"
      traefik.http.routers.openwebui-outpost.service: "authentik-outpost"
      traefik.http.routers.openwebui-outpost.middlewares: "security-headers,rate-limit"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=comfyui
      - COMFYUI_BASE_URL=http://comfyui:8188
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://vectordb:6333
      - WEB_SEARCH_CONCURRENT_REQUESTS=4
      - WEB_SEARCH_TRUST_ENV=true
      - ENABLE_PERSISTENT_CONFIG=true
# --- Authentik: Traefik forward-auth + trusted header ----------------
      # Forward-auth IS the login here, not native OIDC. Do not "upgrade" this
      # back to native OIDC: OpenWebUI's authlib integration cannot talk to
      # Authentik. It lazily GETs the ISSUER ROOT, Authentik answers 302 ->
      # /.well-known/openid-configuration, and raise_for_status() throws, so
      # /oauth/oidc/login returns HTTP 500. Pointing OPENID_PROVIDER_URL at the
      # discovery document instead makes OpenWebUI build malformed discovery
      # candidates and the provider never initialises (404). There is no env var
      # for an explicit metadata URL, so native OIDC is simply not an option.
      - WEBUI_URL=https://openwebui.ghoulhub.uk
      # Single-login: Traefik forward-auth has already authenticated the request
      # and forwarded the identity in X-authentik-*. OpenWebUI trusts that header
      # and auto-logs in by email (auto-creating the user if new), so there is no
      # second login form. Emails match the existing local accounts, so existing
      # users keep their chats and roles.
      # NOTE: do NOT set ENABLE_PASSWORD_AUTH=false. /api/v1/auths/signin checks
      # that flag BEFORE the trusted-header branch and would 403 the entire flow.
      # Deliberately NOT setting WEBUI_AUTH_TRUSTED_ROLE_HEADER: role is left
      # untouched so the existing admin account keeps admin.
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-authentik-email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-authentik-name
      # MUST be explicitly false, not merely absent: OpenWebUI defaults
      # ENABLE_OAUTH to true, and any advertised OIDC provider makes the SPA
      # render a "Sign in with Authentik" button that 500s (see above). That
      # button is what produced the reported "logs in, then bounces back to the
      # SSO start page" loop. Disabled here so the only path in is the trusted
      # header, which the SPA drives automatically with empty credentials
      # (userSignIn('', '')) whenever features.auth_trusted_header is true.
      - ENABLE_OAUTH=false
      # Close self-registration: openwebui.ghoulhub.uk is publicly reachable, so
      # leaving this on lets anyone on the internet create an account and spend
      # local GPU time.
      - ENABLE_SIGNUP=false
    volumes:
      - ./data/webui:/app/backend/data
      - ./data/webui/config/images:/app/backend/open_webui/utils/images
    depends_on:
      - ollama
      - comfyui
      - vectordb
      - searxng
    restart: unless-stopped
    networks:
      - ai-net
      - proxy

  # ──────────────────────────────────────────────
  # ComfyUI - Image Generation (NVIDIA)
  # ──────────────────────────────────────────────
  comfyui:
    image: pytorch/pytorch:2.12.1-cuda13.0-cudnn9-runtime
    container_name: comfyui
    gpus: all
    # No host port. ComfyUI has NO authentication of its own -- `main.py --help`
    # exposes no --user/--password/--token flag -- so any host binding means the
    # app is usable by anyone who can reach the port. Measured while this was
    # still published on the LAN, unauthenticated:
    #   GET  /api/system_stats -> 200  (host RAM, python/pytorch versions, argv)
    #   GET  /history           -> 200  (every prompt and generated image ever made)
    #   POST /upload/image      -> 200  (writes a file into the ./data/comfyui
    #                                 bind mount on the host)
    #   POST /prompt            -> runs a workflow, i.e. spends GPU time
    # (GET /view with ../../ traversal is already rejected with 400, so that one
    # is patched -- but the four above are not.)
    # Forward-auth is therefore the ONLY integration ComfyUI can take: it has no
    # session or cookie concept to hook trusted headers into the way OpenWebUI
    # does, but forward-auth does not need one. It refuses the request outright
    # unless the browser already holds a valid Authentik session on
    # .ghoulhub.uk, so nothing reaches ComfyUI unauthenticated.
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.comfyui.rule: Host(`comfyui.ghoulhub.uk`)
      traefik.http.routers.comfyui.entrypoints: "websecure"
      traefik.http.routers.comfyui.tls: "true"
      traefik.http.routers.comfyui.tls.certresolver: "le"
      traefik.http.routers.comfyui.priority: "10"
      # REQUIRED. The pytorch/pytorch image has no EXPOSE directive, and this
      # service no longer has a published port either, so Traefik has nothing to
      # infer the container port from and the router silently disappears:
      #   ERR service "comfyui-ai-stack" error: port is missing  providerName=docker
      # which surfaces as a bare 404 with no hint of the cause. open-webui does
      # not need this because its image exposes 8080.
      traefik.http.services.comfyui.loadbalancer.server.port: "8188"
      # rate-limit and security-headers FIRST, authentik-forwardauth LAST. Traefik
      # runs middlewares left to right and stops at the first one that ends the
      # request, so a short-circuiting middleware placed first would send every
      # anonymous visitor to Authentik without ever passing the rate limiter.
      traefik.http.routers.comfyui.middlewares: "rate-limit,security-headers,authentik-forwardauth"
      # Companion router so the Authentik OAuth callback can return to this host
      # without being re-challenged by forward-auth (rule 9 deadlock). Priority 15
      # outranks the app router's 10.
      traefik.http.routers.comfyui-outpost.rule: Host(`comfyui.ghoulhub.uk`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.comfyui-outpost.entrypoints: "websecure"
      traefik.http.routers.comfyui-outpost.tls: "true"
      traefik.http.routers.comfyui-outpost.tls.certresolver: "le"
      traefik.http.routers.comfyui-outpost.priority: "15"
      traefik.http.routers.comfyui-outpost.service: "authentik-outpost"
      traefik.http.routers.comfyui-outpost.middlewares: "security-headers,rate-limit"
    shm_size: 32g
    volumes:
      - ./data/comfyui:/workspace
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y --no-install-recommends libxcb1 libgl1 libglib2.0-0 &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore torchvision==0.27.1 torchaudio==2.11.0 &&
      grep -vE '^(torch|torchvision|torchaudio|xformers)([<>=!~]|$)' /workspace/requirements.txt > /tmp/requirements-comfyui.txt &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore -r /tmp/requirements-comfyui.txt &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore -r /workspace/custom_nodes/ComfyUI_PuLID_Flux_ll/requirements.txt &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore -r /workspace/custom_nodes/ComfyUI_Patches_ll/requirements.txt &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore -r /workspace/custom_nodes/ComfyUI-GGUF/requirements.txt &&
      python3 -m pip install --break-system-packages --no-cache-dir --root-user-action=ignore --no-deps facenet-pytorch==2.6.0 &&
      python3 /workspace/main.py --listen 0.0.0.0 --port 8188 --force-fp16 --use-pytorch-cross-attention --preview-method none --lowvram
      "
    restart: unless-stopped
    networks:
      - ai-net
      - proxy

  # ──────────────────────────────────────────────
  # Qdrant - Vector DB
  # ──────────────────────────────────────────────
  vectordb:
    image: qdrant/qdrant:latest
    container_name: vectordb
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks:
      - ai-net

  # ──────────────────────────────────────────────
  # MCPO - Fast Search Bridge
  # ──────────────────────────────────────────────
  mcpo:
    # Floating tag, same rationale as open-webui above. This one is just a
    # search bridge, so an unexpected bump costs nothing.
    image: ghcr.io/open-webui/mcpo:latest
    container_name: mcpo
    volumes:
      - ./data/mcpo:/app/config
    environment:
      - SEARXNG_URL=http://searxng:8080
    command: mcpo --config /app/config/config.json
    restart: unless-stopped
    networks:
      - ai-net

  # ──────────────────────────────────────────────
  # SearXNG - Meta Search
  # ──────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    # Loopback + tailnet, never 0.0.0.0, and deliberately NOT behind Authentik.
    #
    # opencode's searxng_search tool talks to http://127.0.0.1:8888 from this
    # machine, and you want it usable from another tailnet device too. That is
    # machine-to-machine traffic (rule 6), which authenticates with service
    # credentials rather than interactive SSO, so a forward-auth gate would be
    # wrong here — it would break the tool while adding nothing.
    #
    # A public searxng would be a gift to strangers: it is a free anonymising
    # proxy that launders their traffic through your home IP, and every query
    # you run leaks that IP to Google and Bing.
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
      - "${TAILSCALE_IP:?TAILSCALE_IP unset - run ../bootstrap.sh}:${SEARXNG_PORT:-8888}:8080"
    environment:
      - SEARXNG_VALKEY_URL=redis://redis:6379/0
    volumes:
      - ./data/searxng/config:/etc/searxng
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - ai-net

  # ──────────────────────────────────────────────
  # Valkey - Redis-compatible cache
  # ──────────────────────────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge
  # Created by ../bootstrap.sh. Shared with Traefik and every app stack so a
  # service can be published without ever binding a host port.
  proxy:
    external: true
